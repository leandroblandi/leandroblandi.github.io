<section
  *transloco="let t"
  id="home"
  appSpotlight
  class="relative isolate flex min-h-svh items-center overflow-hidden [--spotlight-size:700px]"
>
  <div class="pointer-events-none absolute inset-0 -z-10" aria-hidden="true">
    <div class="grid-bg absolute inset-0 opacity-70"></div>
    <div
      data-blob
      class="absolute -top-40 -left-32 size-[34rem] rounded-full bg-accent/30 blur-[120px]"
    ></div>
    <div
      data-blob
      class="absolute top-1/4 -right-32 size-[30rem] rounded-full bg-accent-2/20 blur-[120px]"
    ></div>
    <div
      data-blob
      class="absolute -bottom-48 left-1/3 size-[28rem] rounded-full bg-accent-3/20 blur-[120px]"
    ></div>
    <div
      data-blob
      class="absolute top-1/2 left-1/5 size-[18rem] rounded-full bg-accent/15 blur-[100px]"
    ></div>
    <div class="absolute inset-x-0 bottom-0 h-48 bg-linear-to-b from-transparent to-bg"></div>
  </div>

  <div data-content class="mx-auto w-full max-w-6xl px-6 pt-28 pb-20">
    <p data-reveal class="mono-label mb-4">{{ t('hero.greeting') }}</p>

    <h1 class="text-display font-bold tracking-tighter" [attr.aria-label]="site.name">
      <span
        class="mr-[0.25em] inline-block overflow-hidden pb-[0.12em] align-bottom"
        aria-hidden="true"
      >
        <span data-word data-reveal class="text-gradient inline-block">Leandro</span>
      </span>
      <span class="inline-block overflow-hidden pb-[0.12em] align-bottom" aria-hidden="true">
        <span data-word data-reveal class="text-gradient inline-block">Blandi</span>
      </span>
    </h1>

    <p data-reveal class="mt-6 h-[1.5em] font-mono text-h3 text-fg">
      <span class="text-accent-fg" aria-hidden="true">&gt;_ </span>
      <span aria-hidden="true">{{ typed() }}</span>
      <span
        class="ml-0.5 inline-block h-[1.1em] w-[0.55ch] translate-y-[0.2em] bg-accent-fg animate-[caret-blink_1s_steps(1)_infinite] motion-reduce:animate-none"
        aria-hidden="true"
      ></span>
      <span class="sr-only">{{ roles.join(' · ') }}</span>
    </p>

    <p data-reveal class="mt-6 max-w-xl text-lg text-muted md:text-xl">{{ t('hero.tagline') }}</p>

    <div data-reveal class="mt-10 flex flex-wrap items-center gap-3">
      <a appButton="primary" [href]="site.cv[lang()]" download>
        <app-icon name="download" />
        {{ t('hero.cv') }}
      </a>
      <a appButton="secondary" [href]="'/' + lang() + '#contact'">
        {{ t('hero.contact') }}
        <app-icon name="arrow-right" />
      </a>
      <a appButton="ghost" [href]="site.github" target="_blank" rel="noopener" aria-label="GitHub">
        <app-icon name="github" />
        GitHub
      </a>
    </div>
  </div>

  <a
    data-reveal
    [href]="'/' + lang() + '#about'"
    class="absolute bottom-8 left-1/2 flex -translate-x-1/2 flex-col items-center gap-2 font-mono text-xs tracking-[0.3em] text-muted uppercase hover:text-fg"
  >
    {{ t('hero.scroll') }}
    <app-icon name="arrow-down" class="size-4 animate-bounce motion-reduce:animate-none" />
  </a>
</section>
