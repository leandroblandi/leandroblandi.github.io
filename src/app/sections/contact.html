<section
  *transloco="let t; prefix: 'contact'"
  id="contact"
  class="mx-auto max-w-6xl px-6 py-24 md:py-32"
>
  <div
    data-panel
    appSpotlight
    class="glass relative overflow-hidden rounded-[2rem] px-6 py-16 text-center [--spotlight-size:600px] md:px-16 md:py-24"
  >
    <div class="pointer-events-none absolute inset-0 -z-10" aria-hidden="true">
      <div
        data-orb
        class="absolute top-1/2 left-1/2 size-[48rem] -translate-1/2 rounded-full opacity-30 blur-3xl [background:conic-gradient(from_0deg,#f97316,#f59e0b,#ea580c,#7c2d12,#f97316)]"
      ></div>
      <div class="grid-bg absolute inset-0"></div>
    </div>

    <p data-cta class="mono-label mb-6">// 05 · {{ t('label') }}</p>
    <h2 data-cta class="text-display font-bold tracking-tighter">
      <span class="text-gradient">{{ t('title') }}</span>
    </h2>
    <p data-cta class="mx-auto mt-6 max-w-xl text-lg text-muted">{{ t('body') }}</p>

    <div data-cta class="mt-10 flex flex-wrap items-center justify-center gap-3">
      <a appButton="primary" [href]="'mailto:' + site.email">
        <app-icon name="mail" />
        {{ t('email') }}
      </a>
      <button appButton="secondary" type="button" (click)="copyEmail()">
        <app-icon [name]="copied() ? 'check' : 'copy'" />
        <span aria-live="polite">{{ copied() ? t('copied') : t('copy') }}</span>
      </button>
      <a appButton="secondary" [href]="site.cv[lang()]" download>
        <app-icon name="download" />
        {{ t('cv') }}
      </a>
      <a appButton="ghost" [href]="site.github" target="_blank" rel="noopener">
        <app-icon name="github" />
        GitHub
      </a>
    </div>

    <p data-cta class="mt-8 font-mono text-sm text-muted">{{ site.email }}</p>
  </div>
</section>
